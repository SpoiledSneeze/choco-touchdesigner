name: Auto Update Packages

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  update-packages:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PowerShell & AU Module
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Install-Module au -RequiredVersion 2022.10.24 -Force -Scope CurrentUser

      - name: Run AU Update Script
        id: au
        shell: powershell
        run: |
          Set-Location "automatic\touchdesigner"
          $result = ./update.ps1
          $result
          $updated = ($result | Where-Object { $_ -match 'Package updated' }) -ne $null
          echo "updated=$($updated.ToString().ToLower())" >> $Env:GITHUB_OUTPUT

      - name: Push to Chocolatey
        if: steps.au.outputs.updated == 'true'
        shell: powershell
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $nupkg = Get-ChildItem "automatic\touchdesigner\*.nupkg" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($nupkg) {
            Write-Host "Pushing $($nupkg.Name) to Chocolatey..."
            choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $Env:CHOCOLATEY_API_KEY
          } else {
            Write-Host "No .nupkg found to push."
            exit 1
          }

      - name: Commit and Push Changes
        if: steps.au.outputs.updated == 'true'
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          $status = git status --porcelain
          if ($status) {
              git commit -m "(touchdesigner) Automatic update to latest version"
              git push
          } else {
              Write-Host "No file changes to commit."
          }